name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm 11.5.1+ is required for OIDC trusted publishing.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Verify package name and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const pkg = require("./package.json");
          if (pkg.name !== "opencode-muse") {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag must be v${pkg.version}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      # npm exchanges GitHub's OIDC identity for a short-lived publish token.
      # No NPM_TOKEN or other long-lived npm credential is needed.
      - name: Publish package
        run: npm publish
