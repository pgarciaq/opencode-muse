name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # v7: no dummy NODE_AUTH_TOKEN fallback. setup-node v6 wrote a dummy
      # token into the generated .npmrc when registry-url is set, which made
      # npm skip the OIDC trusted-publishing path and fail with E404 on PUT.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm 11.5.1+ is required for OIDC trusted publishing.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Verify package name and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const pkg = require("./package.json");
          if (pkg.name !== "opencode-muse") {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag must be v${pkg.version}`);
          }
          NODE

      - name: Check whether this version is already published
        id: npm-version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`;
          const response = await fetch(url);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, "published=false\n");
            console.log(`${pkg.name}@${pkg.version} is not on npm yet.`);
          } else if (response.ok) {
            appendFileSync(process.env.GITHUB_OUTPUT, "published=true\n");
            console.log(`${pkg.name}@${pkg.version} is already on npm; duplicate publish will be skipped.`);
          } else {
            throw new Error(`npm registry returned HTTP ${response.status}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      # npm exchanges GitHub's OIDC identity for a short-lived publish token.
      # No NPM_TOKEN or other long-lived npm credential is needed.
      - name: Publish package
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish
